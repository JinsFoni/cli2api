name: Docker Image

run-name: Docker image for ${{ github.event.release.tag_name }}

# Builds and pushes the release image when a release is published. The
# Release workflow (release.yml) also ships an image pipeline for its own
# dispatch-driven flow; this job is skipped when the version tag already
# exists on ghcr.io so the two never fight over the same tag.
on:
  release:
    types: [published]

concurrency:
  group: docker-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Skip when the release image already exists
        id: guard
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$TAG is already published; skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
        if: steps.guard.outputs.exists != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.guard.outputs.exists != 'true'
      - uses: docker/login-action@v3
        if: steps.guard.outputs.exists != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        if: steps.guard.outputs.exists != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}
      - name: Build and push multi-platform image
        if: steps.guard.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.event.release.tag_name }}
            APP_COMMIT=${{ github.event.release.target_commitish }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summarize
        if: steps.guard.outputs.exists != 'true'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          {
            echo "## Published ghcr.io/${GITHUB_REPOSITORY,,}:$TAG"
            echo
            echo "- Platforms: linux/amd64, linux/arm64"
            echo "- Trigger: release $TAG published"
          } >> "$GITHUB_STEP_SUMMARY"
