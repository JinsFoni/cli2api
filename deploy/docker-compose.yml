services:
  qoder-api-proxy:
    image: ghcr.io/caigee-cmd/cli2api:latest
    container_name: qoder-api-proxy
    volumes:
      - ./qoder-data:/data
      - ./cli2api-updater:/run/cli2api-updater:ro
    ports:
      - "127.0.0.1:3010:3010"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3010/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
