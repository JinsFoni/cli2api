services:
  qoder-api-proxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: "${CLI2API_IMAGE:-ghcr.io/caigee-cmd/cli2api:latest}"
    container_name: qoder-api-proxy
    # Optional host-updater integration (see deploy/README.md); unset keys
    # simply stay empty. Set QODER_PROXY_URL here if the account needs one.
    environment:
      UPDATE_AGENT_URL: "${UPDATE_AGENT_URL:-}"
      UPDATE_AGENT_TOKEN: "${UPDATE_AGENT_TOKEN:-}"
      UPDATE_GITHUB_TOKEN: "${UPDATE_GITHUB_TOKEN:-}"
    volumes:
      - ./qoder-data:/data
      - ./cli2api-updater:/run/cli2api-updater:ro
    ports:
      - "127.0.0.1:3010:3010"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3010/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
